# Server Port
server.port=8080

# Spring AI Ollama Configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=codellama:7b
spring.ai.ollama.chat.options.temperature=0.2


# Externalized Prompt Templates
prompts.analyze=You are a senior software engineer reviewing {language} code for a junior developer. Return exactly one raw JSON object and nothing else. Do not use Markdown fences, numbered sections, a JSON label, or conversational text. The object must contain exactly these string keys: "explanation", "errors", "improvedVersion", and "dryRun". Every value must be a JSON string. Escape all double quotes and newlines inside string values according to JSON syntax. The improvedVersion value may contain source code, but it must remain inside a JSON string. Do not invent input values. Keep the dry run based only on the code shown below.\n\nLanguage:\n{language}\n\nCode:\n{code}

prompts.complexity=Analyze the provided code and output a Cyclomatic-style complexity score and category (Low, Moderate, High). Format as: Score: [number], Category: [rating].\n\nCode:\n{code}

prompts.refactor=Review the provided code and return 2 to 3 high-impact refactoring suggestions focusing on readability and maintainability.\n\nCode:\n{code}