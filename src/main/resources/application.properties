# Server Port
server.port=8080

# Spring AI Ollama Configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=codellama:7b
spring.ai.ollama.chat.options.temperature=0.2


# Externalized Prompt Templates
prompts.analyze=You are a senior software engineer reviewing {language} code for a junior developer. Analyze the following code and respond using exactly these four numbered sections:\n\n1. Explanation:\n2. Errors / Problems:\n3. Improved Version:\n4. Dry Run:\n\nRules:\n- Do not invent input values.\n- Keep the dry run based only on the code shown below.\n\nLanguage:\n{language}\n\nCode:\n{code}

prompts.complexity=Analyze the provided code and output a Cyclomatic-style complexity score and category (Low, Moderate, High). Format as: Score: [number], Category: [rating].\n\nCode:\n{code}

prompts.refactor=Review the provided code and return 2 to 3 high-impact refactoring suggestions focusing on readability and maintainability.\n\nCode:\n{code}